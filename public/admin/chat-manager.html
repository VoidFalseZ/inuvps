<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Manager – InuPoi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid #2a2a4a;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 20px;
            color: #a78bfa;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #aaa;
        }

        .stat-value {
            color: #a78bfa;
            font-weight: bold;
        }

        .controls {
            padding: 12px 24px;
            background: #141414;
            border-bottom: 1px solid #222;
            display: flex;
            gap: 10px;
        }

        .btn-refresh {
            padding: 8px 18px;
            background: #a78bfa;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-refresh:hover {
            background: #9061f9;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message-card.admin-msg {
            border-left: 3px solid #a78bfa;
            background: rgba(167, 139, 250, 0.06);
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .admin-avatar {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
        }

        .msg-body {
            flex: 1;
            min-width: 0;
        }

        .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .msg-sender {
            font-weight: 600;
            font-size: 13px;
            color: #e0e0e0;
        }

        .admin-badge {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .msg-time {
            font-size: 11px;
            color: #666;
            margin-left: auto;
        }

        .msg-text {
            font-size: 14px;
            color: #ccc;
            word-break: break-word;
        }

        .msg-image {
            max-width: 200px;
            border-radius: 8px;
            margin-top: 6px;
        }

        .msg-actions {
            margin-top: 8px;
        }

        .btn-delete {
            padding: 5px 12px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Compose bar */
        .compose-bar {
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            padding: 14px 24px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            position: sticky;
            bottom: 0;
        }

        .compose-input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 10px 14px;
            color: #e0e0e0;
            font-size: 14px;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            font-family: inherit;
        }

        .compose-input:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .btn-send {
            padding: 10px 20px;
            background: #a78bfa;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-send:hover {
            background: #9061f9;
        }

        .btn-img-upload {
            padding: 10px 14px;
            background: #2a2a2a;
            color: #a78bfa;
            border: 1px solid #444;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .btn-img-upload:hover {
            border-color: #a78bfa;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.success {
            background: #10b981;
            color: #fff;
        }

        .toast.error {
            background: #ef4444;
            color: #fff;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 60px;
            font-size: 16px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>💬 Chat Manager</h1>
        <div class="header-stats">
            <span>Total: <span class="stat-value" id="statTotal">-</span></span>
            <span>Admin: <span class="stat-value" id="statAdmin">-</span></span>
        </div>
    </div>

    <div class="controls">
        <button class="btn-refresh" onclick="loadMessages()">↻ Refresh</button>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="empty-state">Loading messages...</div>
    </div>

    <!-- Compose bar -->
    <div class="compose-bar">
        <button class="btn-img-upload" onclick="document.getElementById('imgInput').click()"
            title="Upload image">📷</button>
        <input type="file" id="imgInput" accept="image/*" onchange="handleImageSelect(this)">
        <textarea class="compose-input" id="composeText" placeholder="Send a message as Admin..." rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAdminMessage();}"></textarea>
        <button class="btn-send" onclick="sendAdminMessage()">📤 Send</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_KEY = new URLSearchParams(location.search).get('api_key') || '';
        const BASE_URL = location.origin;
        let messages = [];

        function apiUrl(path) {
            return BASE_URL + path + '?api_key=' + API_KEY;
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.className = 'toast', 3000);
        }

        async function loadMessages() {
            try {
                const res = await fetch(apiUrl('/api/admin/chat/messages'));
                const data = await res.json();
                messages = (data.messages || []).reverse(); // newest first
                renderMessages();
            } catch (e) {
                showToast('Failed to load messages: ' + e.message, 'error');
            }
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            const total = messages.length;
            const adminCount = messages.filter(m => m.isAdmin).length;
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statAdmin').textContent = adminCount;

            if (!total) {
                container.innerHTML = '<div class="empty-state">No messages yet.</div>';
                return;
            }

            container.innerHTML = messages.map(m => {
                const isAdmin = m.isAdmin === true;
                const initial = (m.sender || '?')[0].toUpperCase();
                const time = new Date(m.timestamp).toLocaleString();
                const adminBadge = isAdmin ? '<span class="admin-badge">👑 Admin</span>' : '';
                const imgHtml = m.image
                    ? `<img src="${BASE_URL + m.image}" class="msg-image" alt="image">`
                    : '';
                const textHtml = m.text ? `<div class="msg-text">${escapeHtml(m.text)}</div>` : '';

                return `
                <div class="message-card ${isAdmin ? 'admin-msg' : ''}">
                    <div class="msg-avatar ${isAdmin ? 'admin-avatar' : ''}">${initial}</div>
                    <div class="msg-body">
                        <div class="msg-header">
                            <span class="msg-sender">${escapeHtml(m.sender || 'Unknown')}</span>
                            ${adminBadge}
                            <span class="msg-time">${time}</span>
                        </div>
                        ${textHtml}
                        ${imgHtml}
                        <div class="msg-actions">
                            <button class="btn-delete" onclick="deleteMessage('${escapeAttr(m.id)}')">🗑️ Delete</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function deleteMessage(id) {
            if (!confirm('Delete this message?')) return;
            try {
                const res = await fetch(apiUrl('/api/admin/chat/delete'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Message deleted!');
                    messages = messages.filter(m => m.id !== id);
                    renderMessages();
                } else {
                    showToast(data.error || 'Delete failed', 'error');
                }
            } catch (e) {
                showToast('Delete failed: ' + e.message, 'error');
            }
        }

        async function sendAdminMessage(imageUrl = null) {
            const text = document.getElementById('composeText').value.trim();
            if (!text && !imageUrl) { showToast('Enter a message or upload an image', 'error'); return; }

            try {
                const res = await fetch(apiUrl('/api/admin/chat/send'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, image: imageUrl })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('composeText').value = '';
                    showToast('Admin message sent!');
                    await loadMessages();
                } else {
                    showToast(data.error || 'Send failed', 'error');
                }
            } catch (e) {
                showToast('Send failed: ' + e.message, 'error');
            }
        }

        async function handleImageSelect(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch(BASE_URL + '/api/chat/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.url) {
                    await sendAdminMessage(data.url);
                } else {
                    showToast('Image upload failed', 'error');
                }
            } catch (e) {
                showToast('Image upload failed: ' + e.message, 'error');
            }
            input.value = '';
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escapeAttr(str) {
            return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        loadMessages();
    </script>
</body>

</html>
