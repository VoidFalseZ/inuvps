<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InuPoi Admin</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --border: #2e2e2e;
            --text: #e8e8e8;
            --text-muted: #888;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --gold: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .logo {
            text-align: center;
        }

        .logo .crown {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-light);
        }

        .logo p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 36px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            width: 220px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.2);
        }

        .card.gold:hover {
            border-color: var(--gold);
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
        }

        .card .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 14px;
        }

        .card h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card p {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="logo">
        <span class="crown">👑</span>
        <h1>InuPoi Admin</h1>
        <p>Select a management panel</p>
    </div>

    <div class="cards">
        <a class="card" href="chat.html">
            <span class="icon">💬</span>
            <h2>Chat Manager</h2>
            <p>View history, delete messages, send admin announcements</p>
        </a>
        <a class="card gold" href="thumbnails.html">
            <span class="icon">🖼️</span>
            <h2>Thumbnail Manager</h2>
            <p>Upload, regenerate, and delete video thumbnails</p>
        </a>
    </div>
</body>

</html>
